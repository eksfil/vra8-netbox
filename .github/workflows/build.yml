name: Build NetBox IPAM Provider

on:
  workflow_dispatch:   # lets you trigger it manually from the Actions tab
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '8'

      - name: Build package
        run: mvn package -PcollectDependencies -Duser.id=${UID}

      - name: Upload built package
        uses: actions/upload-artifact@v4
        with:
          name: netbox-ipam-package
          path: target/*.zip
